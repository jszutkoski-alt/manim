<title>Diário de Aulas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
  :root {
    --bg: #F1F1F4;
    --surface: #FFFFFF;
    --surface-2: #F7F7F9;
    --surface-3: #ECECF0;
    --ink: #15161A;
    --ink-2: #5C5F69;
    --ink-3: #8B8E98;
    --line: #E2E2E8;
    --line-strong: #CFD0D8;
    --accent: #4B5AD4;
    --accent-ink: #3A47AE;
    --accent-soft: #EDEFFC;
    --on-accent: #FFFFFF;
    --warm: #A8680F;
    --warm-soft: #FBF0DE;
    --good: #2B7757;
    --good-soft: #E5F3EC;
    --shadow-sm: 0 1px 2px rgba(18, 20, 30, .06), 0 1px 1px rgba(18, 20, 30, .04);
    --shadow-md: 0 6px 22px rgba(18, 20, 30, .09), 0 1px 2px rgba(18, 20, 30, .05);
    --shadow-lg: 0 24px 60px rgba(18, 20, 30, .22);
    --r-sm: 8px;
    --r-md: 12px;
    --r-lg: 18px;
    --sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --serif: "Newsreader", "New York", Georgia, "Times New Roman", serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C0D10;
      --surface: #16171C;
      --surface-2: #1B1C22;
      --surface-3: #23242B;
      --ink: #ECEDF1;
      --ink-2: #9FA2AC;
      --ink-3: #70737D;
      --line: #26272E;
      --line-strong: #34363E;
      --accent: #8C96F4;
      --accent-ink: #A9B1FF;
      --accent-soft: #1D1F3C;
      --on-accent: #0C0D10;
      --warm: #DFA659;
      --warm-soft: #2B2317;
      --good: #5EBE94;
      --good-soft: #14261E;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
      --shadow-md: 0 6px 22px rgba(0, 0, 0, .45);
      --shadow-lg: 0 24px 60px rgba(0, 0, 0, .6);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0C0D10;
    --surface: #16171C;
    --surface-2: #1B1C22;
    --surface-3: #23242B;
    --ink: #ECEDF1;
    --ink-2: #9FA2AC;
    --ink-3: #70737D;
    --line: #26272E;
    --line-strong: #34363E;
    --accent: #8C96F4;
    --accent-ink: #A9B1FF;
    --accent-soft: #1D1F3C;
    --on-accent: #0C0D10;
    --warm: #DFA659;
    --warm-soft: #2B2317;
    --good: #5EBE94;
    --good-soft: #14261E;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .5);
    --shadow-md: 0 6px 22px rgba(0, 0, 0, .45);
    --shadow-lg: 0 24px 60px rgba(0, 0, 0, .6);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ---------- barra superior ---------- */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 1000px;
    margin: 0 auto;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-family: var(--serif);
    font-size: 19px;
    letter-spacing: -.01em;
    white-space: nowrap;
  }
  .brand em { font-style: italic; color: var(--accent); }
  .brand-sub {
    font-family: var(--sans);
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .topbar-actions { margin-left: auto; display: flex; gap: 8px; }

  .tabs-rail {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px 10px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs-rail::-webkit-scrollbar { display: none; }
  .tabs {
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    background: var(--surface-3);
    border-radius: 11px;
    min-width: min-content;
  }
  .tab {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 13px;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 500;
    color: var(--ink-2);
    white-space: nowrap;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow-sm);
  }
  .tab .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--tab-cor, var(--ink-3));
    flex: none;
  }
  .tab-add { font-size: 16px; line-height: 1; padding: 6px 12px; color: var(--ink-3); }
  .tab-arquivadas { color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .tab-arquivadas[aria-selected="true"] { color: var(--ink); }
  .tab-add:hover { color: var(--accent); }

  /* ---------- botões ---------- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    border-radius: 9px;
    font-size: 13.5px;
    font-weight: 500;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    transition: background .15s ease, transform .1s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: scale(.98); }
  .btn-primary {
    background: var(--accent);
    border-color: transparent;
    color: var(--on-accent);
  }
  .btn-primary:hover { background: var(--accent-ink); }
  .btn-primary[disabled] { opacity: .45; pointer-events: none; }
  .btn-quiet {
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    color: var(--ink-2);
  }
  .btn-quiet:hover { background: var(--surface-3); color: var(--ink); }
  .btn-sm { padding: 5px 10px; font-size: 12.5px; }

  /* ---------- estrutura ---------- */
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding-block: 32px 80px;
    padding-inline: 20px;
  }
  .page-head { margin-bottom: 26px; }
  .eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  h1 {
    font-family: var(--serif);
    font-size: clamp(28px, 4vw, 36px);
    font-weight: 400;
    letter-spacing: -.02em;
    margin: 4px 0 0;
    text-wrap: balance;
  }
  .page-head p { margin: 8px 0 0; color: var(--ink-2); max-width: 62ch; }
  h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 12px;
  }

  .num { font-variant-numeric: tabular-nums; }

  /* ---------- painel ---------- */
  .painel { display: grid; gap: 34px; }
  .dia-grupo + .dia-grupo { margin-top: 22px; }
  .dia-label {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
  }
  .dia-label strong { font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .dia-label span { font-size: 12.5px; color: var(--ink-3); }
  .dia-label.hoje strong { color: var(--warm); }

  .linha {
    display: grid;
    grid-template-columns: 68px 1fr auto;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 11px 12px;
    border-radius: var(--r-md);
    transition: background .15s ease;
  }
  .linha:hover { background: var(--surface); }
  .linha .hora { font-size: 13px; font-weight: 500; color: var(--ink-2); }
  .linha .conteudo { min-width: 0; }
  .linha .assunto {
    font-family: var(--serif);
    font-size: 16.5px;
    letter-spacing: -.01em;
    display: block;
  }
  .linha .disc {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12.5px;
    color: var(--ink-2);
    margin-top: 2px;
  }
  .linha .disc .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .linha .seta { color: var(--ink-3); font-size: 15px; }

  .destaque {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 22px 24px;
    box-shadow: var(--shadow-md);
    display: flex;
    gap: 22px;
    align-items: flex-start;
    flex-wrap: wrap;
  }
  .destaque .quando {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--warm);
  }
  .destaque h3 {
    font-family: var(--serif);
    font-size: 25px;
    font-weight: 400;
    letter-spacing: -.02em;
    margin: 6px 0 0;
    text-wrap: balance;
  }
  .destaque .detalhe { margin-top: 8px; color: var(--ink-2); font-size: 13.5px; }
  .destaque .lado { margin-left: auto; }

  /* ---------- aba Hoje ---------- */
  .resumo-dia { display: flex; gap: 12px; flex-wrap: wrap; }
  .resumo-item {
    flex: 1;
    min-width: 132px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
  }
  .resumo-item strong { font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
  .resumo-item span { font-size: 12.5px; color: var(--ink-2); }
  .resumo-item.alerta strong { color: var(--warm); }

  .dia-disciplina + .dia-disciplina { margin-top: 30px; }
  .dia-disciplina-cabecalho { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dia-disciplina-cabecalho .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dia-disciplina-cabecalho strong { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }

  .alerta-pendente-compacto {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 11px 14px;
    margin-bottom: 10px;
    background: var(--warm-soft);
    border: 1px solid color-mix(in srgb, var(--warm) 30%, transparent);
    border-radius: var(--r-md);
    font-size: 13.5px;
    color: var(--ink);
  }
  .alerta-pendente-compacto span { flex: 1; min-width: 200px; }

  .provas-lista { display: grid; gap: 12px; }
  .prova-card {
    padding: 16px 18px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-sm);
  }
  .prova-cabecalho { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .prova-cabecalho .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .prova-cabecalho strong { font-size: 14.5px; font-weight: 600; }
  .prova-quando { margin-left: auto; font-size: 12.5px; color: var(--warm); font-weight: 500; }
  .prova-detalhe { margin: 8px 0 12px; font-size: 13.5px; color: var(--ink-2); }

  .progresso { display: grid; gap: 2px; }
  .prog-linha {
    display: grid;
    grid-template-columns: 1fr 120px 74px;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 10px 12px;
    border-radius: var(--r-md);
    transition: background .15s ease;
  }
  .prog-linha:hover { background: var(--surface); }
  .prog-nome { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; min-width: 0; }
  .prog-nome .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .prog-nome span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra { height: 5px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
  .barra i { display: block; height: 100%; border-radius: 3px; }
  .prog-num { font-size: 12.5px; color: var(--ink-3); text-align: right; }

  /* ---------- cards de aula ---------- */
  .aulas { display: grid; gap: 14px; }
  .aula {
    display: grid;
    grid-template-columns: 62px 1fr;
    gap: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 20px 22px;
    box-shadow: var(--shadow-sm);
  }
  .aula[data-estado="proxima"] {
    border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
    box-shadow: var(--shadow-md);
  }
  .aula[data-estado="hoje"] {
    border-color: color-mix(in srgb, var(--warm) 48%, var(--line));
    box-shadow: var(--shadow-md);
  }
  .aula[data-estado="passada"] { background: var(--surface-2); }

  .cal {
    text-align: center;
    padding-top: 2px;
    border-right: 1px solid var(--line);
    margin-right: -6px;
  }
  .cal .dow { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .cal .dia { display: block; font-size: 29px; font-weight: 600; letter-spacing: -.03em; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .cal .mes { display: block; font-size: 11.5px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
  .aula[data-estado="hoje"] .cal .dia { color: var(--warm); }
  .aula[data-estado="proxima"] .cal .dia { color: var(--accent); }

  .aula-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 7px; }
  .pill {
    display: inline-flex;
    align-items: center;
    padding: 2.5px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .pill-proxima { background: var(--accent-soft); color: var(--accent-ink); }
  .pill-hoje { background: var(--warm-soft); color: var(--warm); }
  .pill-passada { background: var(--surface-3); color: var(--ink-3); }
  .pill-nota { background: var(--good-soft); color: var(--good); }
  .aula-meta .hora { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .aula-meta .sala { font-size: 12.5px; color: var(--ink-3); }

  .aula h3 {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 400;
    letter-spacing: -.015em;
    margin: 0;
    text-wrap: balance;
  }

  .notas { display: grid; gap: 8px; margin-top: 16px; }
  .nota {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 11px 13px;
    background: var(--surface-2);
    border-radius: var(--r-md);
    border: 1px solid var(--line);
  }
  .aula[data-estado="passada"] .nota { background: var(--surface); }
  .nota p { margin: 0; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .nota time { display: block; margin-top: 4px; font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .nota .apagar { margin-left: auto; color: var(--ink-3); font-size: 15px; line-height: 1; padding: 2px 4px; flex: none; }
  .nota .apagar:hover { color: #C2453B; }

  .compositor { margin-top: 14px; display: grid; gap: 10px; }
  textarea, input[type="text"], input[type="number"] {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--line-strong);
    border-radius: var(--r-md);
    padding: 11px 13px;
    font-size: 14px;
    resize: vertical;
  }
  textarea::placeholder, input::placeholder { color: var(--ink-3); }
  textarea:focus, input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .compositor-acoes { display: flex; align-items: center; gap: 10px; }
  .dica { font-size: 12px; color: var(--ink-3); margin-left: auto; }

  /* ---------- cronograma ---------- */
  details.crono { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 16px; }
  details.crono > summary {
    cursor: pointer;
    list-style: none;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--ink-3);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  details.crono > summary::-webkit-details-marker { display: none; }
  details.crono > summary::before { content: "▸"; transition: transform .18s ease; }
  details.crono[open] > summary::before { transform: rotate(90deg); }
  .crono-tabela { margin-top: 14px; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--ink-3);
    padding: 0 12px 8px 0;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.data { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  tr.feita td { color: var(--ink-3); }
  tr.atual td { background: var(--accent-soft); }
  tr.atual td:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); padding-left: 8px; }
  tr.atual td:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }

  .cel-editavel {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    padding: 3px 7px;
    margin: -3px -7px;
    border-radius: 6px;
    overflow-wrap: anywhere;
  }
  .cel-editavel:hover { background: var(--accent-soft); }
  td.vazia .cel-editavel { color: var(--ink-3); }
  .celula-editor { display: flex; align-items: center; gap: 6px; }
  .celula-input {
    flex: 1;
    min-width: 84px;
    padding: 4px 8px;
    font: inherit;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 6px;
  }
  .celula-input:focus { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .celula-acoes { display: flex; gap: 3px; flex: none; }
  .celula-acoes button {
    width: 24px;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: 12.5px;
    line-height: 1;
  }
  .celula-ok { background: var(--good-soft); color: var(--good); }
  .celula-ok:hover { background: color-mix(in srgb, var(--good) 26%, var(--good-soft)); }
  .celula-cancelar { color: var(--ink-3); }
  .celula-cancelar:hover { background: var(--surface-3); color: var(--ink); }

  /* ---------- etiquetas e conteúdo pendente ---------- */
  .pill-alerta { background: var(--warm-soft); color: var(--warm); }
  .acao-discreta {
    font-size: 12px;
    color: var(--ink-3);
    padding: 2.5px 6px;
    border-radius: 6px;
  }
  .acao-discreta:hover { color: var(--ink); background: var(--surface-3); }

  .etiquetas { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; }
  .etiqueta {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 6px 3px 10px;
    border-radius: 999px;
    background: var(--surface-3);
    font-size: 11.5px;
    font-weight: 500;
    color: var(--ink-2);
  }
  .etiqueta button { color: var(--ink-3); font-size: 10.5px; line-height: 1; padding: 1px; }
  .etiqueta button:hover { color: #C2453B; }
  .etiqueta-add {
    font-size: 11.5px;
    color: var(--ink-3);
    padding: 3px 10px;
    border-radius: 999px;
    border: 1px dashed var(--line-strong);
  }
  .etiqueta-add:hover { color: var(--ink); border-color: var(--ink-3); }

  .etiqueta-editor { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .etiqueta-input {
    width: 140px;
    padding: 5px 10px;
    font: inherit;
    font-size: 12.5px;
    background: var(--surface-2);
    border: 1px solid var(--accent);
    border-radius: 999px;
  }
