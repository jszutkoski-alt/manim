<script>
(function () {
  "use strict";

  /* ============================================================
     utilidades
     ============================================================ */

  const $ = (sel, raiz) => (raiz || document).querySelector(sel);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
  const id = () => (crypto.randomUUID ? crypto.randomUUID() : "x" + Math.random().toString(36).slice(2) + Date.now().toString(36));
  const chave = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ").trim();

  const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  const DIAS_LONGOS = ["domingo", "segunda-feira", "terça-feira", "quarta-feira", "quinta-feira", "sexta-feira", "sábado"];
  const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  const MESES_LONGOS = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

  const CORES = ["#4B5AD4", "#1F7A6C", "#B4552B", "#7B4BC4", "#2C6FBF", "#A03D63", "#4E7B22", "#8A6A1E"];

  function isoDe(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function dataDe(iso) {
    const p = String(iso).split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }
  const HOJE = isoDe(new Date());

  function partes(iso) {
    const d = dataDe(iso);
    return {
      dow: DIAS[d.getDay()],
      dowLongo: DIAS_LONGOS[d.getDay()],
      dia: String(d.getDate()).padStart(2, "0"),
      mes: MESES[d.getMonth()],
      mesLongo: MESES_LONGOS[d.getMonth()],
      ano: d.getFullYear()
    };
  }
  function dataExtenso(iso) {
    const p = partes(iso);
    return p.dowLongo + ", " + (+p.dia) + " de " + p.mesLongo;
  }
  function dataCurta(iso) {
    const p = partes(iso);
    return p.dia + "/" + String(dataDe(iso).getMonth() + 1).padStart(2, "0") + "/" + p.ano;
  }
  function distancia(iso) {
    const dias = Math.round((dataDe(iso) - dataDe(HOJE)) / 86400000);
    if (dias === 0) return "hoje";
    if (dias === 1) return "amanhã";
    if (dias === -1) return "ontem";
    if (dias > 0) return "em " + dias + " dias";
    return "há " + Math.abs(dias) + " dias";
  }
  function faixaHora(a) {
    if (!a.inicio) return "";
    return a.fim ? a.inicio + "–" + a.fim : a.inicio;
  }
  function carimbo(ts) {
    const d = new Date(ts);
    if (isNaN(d)) return "";
    return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + " às " +
      String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  let toastTimer = null;
  function avisar(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("visivel");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("visivel"), 2800);
  }

  /* ============================================================
     leitor do plano de ensino
     ============================================================ */

  const MESES_MAPA = {};
  MESES.forEach((m, i) => { MESES_MAPA[m] = i + 1; });
  MESES_MAPA["set"] = 9; MESES_MAPA["sep"] = 9;

  function lerData(bruto, anoPadrao) {
    const txt = String(bruto || "").trim();
    let m = txt.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return montar(+m[1], +m[2], +m[3]);
    m = txt.match(/(\d{1,2})\s*[\/\.\-]\s*(\d{1,2})(?:\s*[\/\.\-]\s*(\d{2,4}))?/);
    if (m) {
      let ano = anoPadrao;
      if (m[3]) ano = m[3].length === 2 ? 2000 + (+m[3]) : +m[3];
      return montar(ano, +m[2], +m[1]);
    }
    m = txt.match(/(\d{1,2})\s*(?:de\s+)?([a-zà-ÿ]{3,})/i);
    if (m) {
      const mes = MESES_MAPA[m[2].slice(0, 3).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")];
      if (mes) return montar(anoPadrao, mes, +m[1]);
    }
    return null;
  }
  function montar(ano, mes, dia) {
    if (!ano || !mes || !dia || mes > 12 || dia > 31) return null;
    return ano + "-" + String(mes).padStart(2, "0") + "-" + String(dia).padStart(2, "0");
  }

  function lerHorario(bruto) {
    const achados = [];
    const re = /(\d{1,2})\s*(?:[:h])\s*(\d{2})?/gi;
    let m;
    while ((m = re.exec(String(bruto || "")))) {
      const h = +m[1];
      if (h > 23) continue;
      achados.push(String(h).padStart(2, "0") + ":" + (m[2] || "00"));
    }
    if (!achados.length) return null;
    return { inicio: achados[0], fim: achados[1] || null };
  }
  const PARECE_HORA = /^\s*\d{1,2}\s*[:h]\s*\d{0,2}\s*(?:(?:às|as|a|-|–|—|até)\s*\d{1,2}\s*[:h]?\s*\d{0,2})?\s*(?:h|hs|horas)?\s*$/i;

  function limpar(txt) {
    return String(txt || "")
      .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, "$2")
      .replace(/\[\[([^\]]+)\]\]/g, "$1")
      .replace(/\*\*|__|`/g, "")
      .replace(/^\s*[-*+]\s+/, "")
      .replace(/^\s*\d+[\.\)]\s+/, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  // Lê o texto colado e devolve {nome, horario, aulas:[], ignoradas:n}
  function lerPlano(texto, anoPadrao) {
    const saida = { nome: "", horario: "", curso: "", codigo: "", sala: "", aulas: [], ignoradas: 0, duplicadas: 0 };
    if (!texto || !texto.trim()) return saida;

    let corpo = texto.replace(/\r\n?/g, "\n");

    // frontmatter
    const fm = corpo.match(/^---\n([\s\S]*?)\n---\n?/);
    if (fm) {
      corpo = corpo.slice(fm[0].length);
      fm[1].split("\n").forEach((linha) => {
        const p = linha.match(/^\s*([\w\-À-ſ]+)\s*:\s*(.+?)\s*$/);
        if (!p) return;
        const k = chave(p[1]);
        const v = p[2].replace(/^["']|["']$/g, "").trim();
        if (!saida.nome && ["disciplina", "nome", "title", "titulo", "materia", "componente"].includes(k)) saida.nome = v;
        if (!saida.horario && ["horario", "hora", "aula", "encontro"].includes(k)) saida.horario = v;
        if (!saida.curso && ["curso", "graduacao", "programa"].includes(k)) saida.curso = v;
        if (!saida.codigo && ["codigo", "turma", "sigla", "cod"].includes(k)) saida.codigo = v;
        if (!saida.sala && ["sala", "local", "sala de aula", "espaco"].includes(k)) saida.sala = v;
      });
    }

    const linhas = corpo.split("\n");
    let unidade = "";
    let colunas = null;

    for (let i = 0; i < linhas.length; i++) {
      const bruta = linhas[i];
      const linha = bruta.trim();
      if (!linha) continue;

      // títulos
      const h = linha.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        const titulo = limpar(h[2]);
        if (h[1].length === 1 && !saida.nome) saida.nome = titulo;
        else if (h[1].length >= 2) unidade = titulo;
        colunas = null;
        continue;
      }

      // tabelas
      if (linha.startsWith("|")) {
        const celulas = linha.replace(/^\||\|$/g, "").split("|").map((c) => limpar(c));
        if (celulas.every((c) => /^:?-{2,}:?$/.test(c.replace(/\s/g, "")))) continue;
        if (!colunas) {
          const mapa = mapearColunas(celulas);
          if (mapa) { colunas = mapa; continue; }
          colunas = { data: 0, hora: -1, assunto: 1, unidade: -1 };
        }
        const aula = daTabela(celulas, colunas, anoPadrao, unidade);
        if (aula) saida.aulas.push(aula); else if (celulas.join("")) saida.ignoradas++;
        continue;
      }
      colunas = null;

      // listas e linhas soltas
      if (/^[-*+]\s+/.test(linha) || /^\d+[\.\)]\s+/.test(linha) || /^\d{1,4}[\/\-]/.test(linha)) {
        const aula = daLinha(linha, anoPadrao, unidade);
        if (aula) saida.aulas.push(aula); else saida.ignoradas++;
      }
    }

    saida.aulas.sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : (a.inicio || "") < (b.inicio || "") ? -1 : 1));

    // linhas repetidas no próprio texto colado (mesma data, horário e assunto)
    const vistas = new Set();
    saida.aulas = saida.aulas.filter((a) => {
      const k = a.data + "|" + (a.inicio || "") + "|" + (a.fim || "") + "|" + chave(a.assunto);
      if (vistas.has(k)) { saida.duplicadas++; return false; }
      vistas.add(k);
      return true;
    });

    if (!saida.horario) {
      const comum = maisComum(saida.aulas.filter((a) => a.inicio).map((a) => faixaHora(a)));
      if (comum) saida.horario = comum;
    }
    return saida;
  }

  function mapearColunas(celulas) {
    const mapa = { data: -1, hora: -1, assunto: -1, unidade: -1 };
    celulas.forEach((c, i) => {
      const k = chave(c);
      if (mapa.data < 0 && /^(data|dia|datas|encontro|quando)$/.test(k)) mapa.data = i;
      else if (mapa.hora < 0 && /^(horario|hora|horas|hora inicio|periodo)$/.test(k)) mapa.hora = i;
      else if (mapa.assunto < 0 && /(assunto|conteudo|tema|topico|descricao|atividade|aula)/.test(k)) mapa.assunto = i;
      else if (mapa.unidade < 0 && /(unidade|modulo|etapa|bloco|semana)/.test(k)) mapa.unidade = i;
    });
    if (mapa.data < 0 || mapa.assunto < 0) return null;
    return mapa;
  }

  function daTabela(celulas, col, anoPadrao, unidade) {
    const data = lerData(celulas[col.data], anoPadrao);
    if (!data) return null;
    const assunto = limpar(celulas[col.assunto] || "");
    if (!assunto) return null;
    const hr = col.hora >= 0 ? lerHorario(celulas[col.hora]) : null;
    return {
      data: data,
      inicio: hr ? hr.inicio : null,
      fim: hr ? hr.fim : null,
      assunto: assunto,
      unidade: col.unidade >= 0 ? limpar(celulas[col.unidade] || "") : unidade
    };
  }

  const SEPARADOR = /^[\s—–\-|;:.·]+/;

  function daLinha(linha, anoPadrao, unidade) {
    let resto = limpar(linha);
    const achouData = resto.match(/^(\d{4}-\d{1,2}-\d{1,2}|\d{1,2}\s*[\/.]\s*\d{1,2}(?:\s*[\/.]\s*\d{2,4})?|\d{1,2}\s*(?:de\s+)?[a-zà-ÿ]{3,}\.?(?:\s+de\s+\d{4})?)/i);
    if (!achouData) return null;
    const data = lerData(achouData[1], anoPadrao);
    if (!data) return null;
    resto = resto.slice(achouData[0].length).replace(SEPARADOR, "");

    let hr = null;
    const achouHora = resto.match(/^\d{1,2}\s*[:h]\s*\d{0,2}(?:\s*(?:às|as|até|a|-|–|—)\s*\d{1,2}\s*[:h]?\s*\d{0,2})?\s*(?:h|hs|horas)?/i);
    if (achouHora) {
      hr = lerHorario(achouHora[0]);
      resto = resto.slice(achouHora[0].length).replace(SEPARADOR, "");
    }

    const assunto = resto.trim();
    if (!assunto) return null;
    return { data: data, inicio: hr ? hr.inicio : null, fim: hr ? hr.fim : null, assunto: assunto, unidade: unidade };
  }

  function maisComum(lista) {
    const contagem = {};
    let melhor = "", maior = 0;
    lista.forEach((v) => {
      if (!v) return;
      contagem[v] = (contagem[v] || 0) + 1;
      if (contagem[v] > maior) { maior = contagem[v]; melhor = v; }
    });
    return melhor;
  }

  /* ============================================================
     estado e armazenamento
     ============================================================ */

  const estado = {
    disciplinas: [],
    aulas: [],
    aba: "painel",
    pronto: false,
    nuvem: false,
    abertos: new Set(),
    etiquetasAbertas: new Set(),
    rascunhos: {},
    todasAsAulas: false,
    editandoCelula: null
  };

  const CHAVE_LOCAL = "diario-de-aulas-v1";
  let bd = null;

  function guardarLocal() {
    try {
      localStorage.setItem(CHAVE_LOCAL, JSON.stringify({ disciplinas: estado.disciplinas, aulas: estado.aulas }));
    } catch (e) { /* armazenamento indisponível: segue em memória */ }
  }
  function lerLocal() {
    try {
      const cru = localStorage.getItem(CHAVE_LOCAL);
      if (!cru) return;
      const dados = JSON.parse(cru);
      estado.disciplinas = dados.disciplinas || [];
      estado.aulas = dados.aulas || [];
    } catch (e) { /* ignora dados corrompidos */ }
  }

  function porId(lista, alvo) { return lista.find((x) => x.id === alvo) || null; }

  function trocar(lista, obj) {
    const i = lista.findIndex((x) => x.id === obj.id);
    if (i >= 0) lista[i] = obj; else lista.push(obj);
  }

  async function salvarDisciplina(d) {
    trocar(estado.disciplinas, d);
    if (bd) { try { await bd.doc("disciplinas/" + d.id).set(semId(d)); } catch (e) { falhaEscrita(e); } }
    else { guardarLocal(); agendarDesenho(); }
  }
  async function salvarAula(a) {
    trocar(estado.aulas, a);
    if (bd) { try { await bd.doc("aulas/" + a.id).set(semId(a)); } catch (e) { falhaEscrita(e); } }
    else { guardarLocal(); agendarDesenho(); }
  }
  async function apagarAula(a) {
    estado.aulas = estado.aulas.filter((x) => x.id !== a.id);
    if (bd) { try { await bd.doc("aulas/" + a.id).delete(); } catch (e) { falhaEscrita(e); } }
    else { guardarLocal(); agendarDesenho(); }
  }
  async function apagarDisciplina(d) {
    const filhas = estado.aulas.filter((a) => a.disciplinaId === d.id);
    estado.disciplinas = estado.disciplinas.filter((x) => x.id !== d.id);
    estado.aulas = estado.aulas.filter((a) => a.disciplinaId !== d.id);
    if (bd) {
      try {
        await Promise.all(filhas.map((a) => bd.doc("aulas/" + a.id).delete()));
        await bd.doc("disciplinas/" + d.id).delete();
      } catch (e) { falhaEscrita(e); }
    } else { guardarLocal(); }
    estado.aba = "painel";
    agendarDesenho();
  }
  function semId(obj) {
    const copia = Object.assign({}, obj);
    delete copia.id;
    return copia;
  }
  function falhaEscrita(e) {
    const codigo = e && e.code;
    if (codigo === "quota_exceeded") avisar("Limite de aulas guardadas atingido. Apague uma disciplina antiga para continuar.");
    else if (codigo === "revoked" || codigo === "not_granted") avisar("Sem acesso à nuvem agora — as mudanças ficam só nesta sessão.");
    else avisar("Não consegui salvar. Tente de novo em instantes.");
  }

  async function ligarNuvem() {
    let capacidade = null;
    try { capacidade = window.claude && window.claude.use ? await window.claude.use("db") : null; }
    catch (e) { capacidade = null; }
    if (!capacidade) { estado.pronto = true; agendarDesenho(); verificarDuplicatasAuto(); return; }

    bd = capacidade;
    estado.nuvem = true;
    const locais = { disciplinas: estado.disciplinas, aulas: estado.aulas };
    let primeira = true;

    bd.collection("disciplinas").onSnapshot((snap) => {
      estado.disciplinas = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      estado.pronto = true;
      if (primeira) { primeira = false; migrar(locais); }
      agendarDesenho();
    }, erroNuvem);

    bd.collection("aulas").onSnapshot((snap) => {
      estado.aulas = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      estado.pronto = true;
      agendarDesenho();
      verificarDuplicatasAuto();
    }, erroNuvem);
  }

  function erroNuvem(e) {
    estado.nuvem = false;
    estado.pronto = true;
    if (e && e.code === "revoked") avisar("A nuvem ficou indisponível. Recarregue a página para tentar de novo.");
    agendarDesenho();
  }

  // leva para a nuvem o que tiver ficado salvo só neste navegador
  async function migrar(locais) {
    if (!locais.disciplinas.length) return;
    if (estado.disciplinas.length) return;
    for (const d of locais.disciplinas) { await salvarDisciplina(d); }
    for (const a of locais.aulas) { await salvarAula(a); }
    try { localStorage.removeItem(CHAVE_LOCAL); } catch (e) { /* nada a fazer */ }
    avisar("Suas disciplinas foram levadas para a nuvem.");
  }

  /* ============================================================
     consultas
     ============================================================ */

  function aulasDe(discId) {
    return estado.aulas
      .filter((a) => a.disciplinaId === discId)
      .sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : (a.inicio || "") < (b.inicio || "") ? -1 : 1));
  }
  function recorte(discId) {
    const lista = aulasDe(discId);
    const proxIdx = lista.findIndex((a) => a.data >= HOJE);
    if (proxIdx === -1) return { anteriores: lista.slice(-2), proxima: null };
    return { anteriores: lista.slice(Math.max(0, proxIdx - 2), proxIdx), proxima: lista[proxIdx] };
  }
  function proximas(limite) {
    const idsAtivas = new Set(disciplinasAtivas().map((d) => d.id));
    return estado.aulas
      .filter((a) => a.data >= HOJE && idsAtivas.has(a.disciplinaId))
      .sort((a, b) => (a.data < b.data ? -1 : a.data > b.data ? 1 : (a.inicio || "99") < (b.inicio || "99") ? -1 : 1))
      .slice(0, limite);
  }
  function temNota(a) { return !!(a.notas && a.notas.length); }

  // mesma disciplina, data, horário e assunto (ignorando maiúsculas/acentos/pontuação) = a mesma aula
  function chaveDuplicata(a) {
    return a.disciplinaId + "|" + a.data + "|" + (a.inicio || "") + "|" + (a.fim || "") + "|" + chave(a.assunto);
  }

  // Junta aulas duplicadas (opcionalmente restrito a uma disciplina). Mantém a que tem mais
  // anotações, reunindo as anotações das demais nela antes de apagar as repetidas.
  async function removerDuplicadas(discId) {
    const grupos = {};
    estado.aulas
      .filter((a) => !discId || a.disciplinaId === discId)
      .forEach((a) => (grupos[chaveDuplicata(a)] = grupos[chaveDuplicata(a)] || []).push(a));

    let removidas = 0;
    for (const chaveGrupo in grupos) {
      const grupo = grupos[chaveGrupo];
      if (grupo.length < 2) continue;

      grupo.sort((a, b) => (b.notas || []).length - (a.notas || []).length || (a.id < b.id ? -1 : 1));
      const [manter, ...sobras] = grupo;

      const vistas = new Set();
      const notas = [];
      grupo.forEach((a) => (a.notas || []).forEach((n) => {
        const k = n.texto + "|" + n.em;
        if (vistas.has(k)) return;
        vistas.add(k);
        notas.push(n);
      }));
      notas.sort((a, b) => a.em - b.em);

      if (notas.length !== (manter.notas || []).length) await salvarAula(Object.assign({}, manter, { notas: notas }));
      for (const a of sobras) { await apagarAula(a); removidas++; }
    }
    return removidas;
  }

  // roda uma vez, assim que os dados (locais ou da nuvem) terminam de carregar, para
  // limpar duplicatas que já existiam — como as de uma disciplina importada duas vezes
  let dedupeAutoFeita = false;
  async function verificarDuplicatasAuto() {
    if (dedupeAutoFeita) return;
    dedupeAutoFeita = true;
    const n = await removerDuplicadas(null);
    if (n) {
      agendarDesenho();
      avisar(n > 1 ? n + " aulas duplicadas foram removidas automaticamente." : "1 aula duplicada foi removida automaticamente.");
    }
  }

  /* ============================================================
     desenho
     ============================================================ */

  let quadro = null;
  function agendarDesenho() {
    if (quadro) return;
    quadro = requestAnimationFrame(() => { quadro = null; desenhar(); });
  }

  function desenhar() {
    const ativo = document.activeElement;
    const foco = ativo && ativo.dataset ? ativo.dataset.foco : null;
    const selecao = ativo && ativo.selectionStart;

    if (estado.aba !== "painel" && estado.aba !== "semana" && estado.aba !== "arquivadas" && !porId(estado.disciplinas, estado.aba)) estado.aba = "painel";

    desenharAbas();
    const alvo = $("#conteudo");
    alvo.innerHTML = estado.aba === "painel" ? htmlPainel()
      : estado.aba === "semana" ? htmlSemana()
      : estado.aba === "arquivadas" ? htmlArquivadas()
      : htmlDisciplina(porId(estado.disciplinas, estado.aba));

    if (foco) {
      const recuperado = alvo.querySelector('[data-foco="' + foco + '"]');
      if (recuperado) {
        recuperado.focus();
        if (recuperado.setSelectionRange && selecao != null) {
          try { recuperado.setSelectionRange(selecao, selecao); } catch (e) { /* campo sem seleção */ }
        }
      }
    }
    alvo.querySelectorAll("textarea.auto").forEach(ajustarAltura);
  }

  function disciplinasAtivas() { return estado.disciplinas.filter((d) => !d.arquivada); }
  function disciplinasArquivadas() { return estado.disciplinas.filter((d) => d.arquivada); }

  function desenharAbas() {
    const abas = $("#abas");
    const itens = [
      '<button class="tab" role="tab" data-aba="painel" aria-selected="' + (estado.aba === "painel") + '" type="button">Painel</button>',
      '<button class="tab" role="tab" data-aba="semana" aria-selected="' + (estado.aba === "semana") + '" type="button">Semana</button>'
    ];
    disciplinasAtivas()
      .sort((a, b) => (a.criadoEm || 0) - (b.criadoEm || 0))
      .forEach((d) => {
        itens.push(
          '<button class="tab" role="tab" data-aba="' + esc(d.id) + '" aria-selected="' + (estado.aba === d.id) + '" type="button">' +
          '<i class="dot" style="background:' + esc(d.cor || "#888") + '"></i>' + esc(nomeCurto(d.nome)) + "</button>"
        );
      });
    const arquivadas = disciplinasArquivadas();
    if (arquivadas.length) {
      itens.push(
        '<button class="tab tab-arquivadas" role="tab" data-aba="arquivadas" aria-selected="' + (estado.aba === "arquivadas") + '" type="button">Arquivadas · ' + arquivadas.length + "</button>"
      );
    }
    itens.push('<button class="tab tab-add" id="aba-nova" type="button" title="Importar plano de ensino" aria-label="Importar plano de ensino">＋</button>');
    abas.innerHTML = itens.join("");

    const periodo = $("#periodo-atual");
    const p = partes(HOJE);
    periodo.textContent = p.dowLongo + ", " + (+p.dia) + " " + p.mes;
  }

  // "305" vira "Sala 305"; "Lab 2" e "Anfiteatro" ficam como estão
  function rotuloSala(valor) {
    const texto = String(valor || "").trim();
    if (!texto) return "";
    return /^(sala|sl\.?|lab|anfi|audit|bloco|pr[ée]dio|campus|on-?line|remoto|ead)/i.test(texto) ? texto : "Sala " + texto;
  }
  function salaDe(d) { return rotuloSala(d ? (d.sala || d.local) : ""); }

  function nomeCurto(nome) {
    const limpo = String(nome || "Disciplina").trim();
    return limpo.length > 28 ? limpo.slice(0, 27).trimEnd() + "…" : limpo;
  }

  function htmlAvisoArmazenamento() {
    if (estado.nuvem || !estado.pronto) return "";
    return '<p class="aviso-armazenamento">Sem conexão com a nuvem: seus dados estão guardados apenas neste navegador.</p>';
  }

  function htmlPainel() {
    if (!estado.pronto) return '<p class="eyebrow">Carregando…</p>';
    if (!estado.disciplinas.length) {
      return htmlAvisoArmazenamento() +
        '<div class="page-head"><span class="eyebrow">Painel</span><h1>Comece pelo plano de ensino</h1>' +
        "<p>Cole o cronograma de uma disciplina e o diário monta as aulas do semestre — com data, horário e assunto prontos para receber suas anotações.</p></div>" +
        '<div class="vazio"><h3>Nenhuma disciplina ainda</h3><p>Abra a nota do plano de ensino no Obsidian, copie o cronograma e cole aqui.</p>' +
        '<button class="btn btn-primary" data-acao="importar" type="button">Importar plano de ensino</button></div>';
    }

    const ativas = disciplinasAtivas();
    if (!ativas.length) {
      return htmlAvisoArmazenamento() +
        '<div class="page-head"><span class="eyebrow">Painel</span><h1>Tudo arquivado por aqui</h1>' +
        "<p>Suas " + estado.disciplinas.length + (estado.disciplinas.length > 1 ? " disciplinas estão arquivadas." : " disciplina está arquivada.") + " Os dados continuam guardados — é só reativar quando precisar.</p></div>" +
        '<div class="vazio"><h3>Nenhuma disciplina ativa</h3><p>Reative uma disciplina arquivada ou importe um novo plano de ensino.</p>' +
        '<button class="btn btn-primary" data-acao="abrir-arquivadas" type="button">Ver arquivadas</button></div>';
    }

    const lista = proximas(12);
    const destaque = lista[0];
    let html = htmlAvisoArmazenamento() +
      '<div class="page-head"><span class="eyebrow">Painel</span><h1>Suas próximas aulas</h1></div>';

    if (destaque) {
      const d = porId(estado.disciplinas, destaque.disciplinaId);
      html += '<section class="destaque">' +
        "<div>" +
        '<span class="quando">' + esc(destaque.data === HOJE ? "Hoje" : "Próxima aula · " + distancia(destaque.data)) + "</span>" +
        "<h3>" + esc(destaque.assunto) + "</h3>" +
        '<p class="detalhe">' +
        (d ? '<i class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + esc(d.cor) + ';margin-right:6px"></i>' + esc(d.nome) + " · " : "") +
        esc(dataExtenso(destaque.data)) + (faixaHora(destaque) ? " · " + esc(faixaHora(destaque)) : "") +
        (salaDe(d) ? " · " + esc(salaDe(d)) : "") +
        "</p></div>" +
        '<div class="lado"><button class="btn" data-acao="abrir" data-disc="' + esc(destaque.disciplinaId) + '" type="button">Abrir disciplina</button></div>' +
        "</section>";
    }

    const restantes = lista.slice(1);
    if (restantes.length) {
      html += '<section style="margin-top:34px"><h2>Depois dessa</h2>' + htmlAgenda(restantes) + "</section>";
    } else if (!destaque) {
      html += '<div class="vazio"><h3>Semestre encerrado</h3><p>Não há aulas futuras no cronograma. Abra uma disciplina para rever o que já foi dado ou importe um novo plano.</p>' +
        '<button class="btn btn-primary" data-acao="importar" type="button">Importar plano de ensino</button></div>';
    }

    html += '<section style="margin-top:34px"><h2>Andamento do semestre</h2><div class="progresso">' +
      ativas.slice().sort((a, b) => (a.criadoEm || 0) - (b.criadoEm || 0)).map((d) => {
        const todas = aulasDe(d.id);
        const dadas = todas.filter((a) => a.data < HOJE).length;
        const comNota = todas.filter(temNota).length;
        const pct = todas.length ? Math.round((dadas / todas.length) * 100) : 0;
        return '<button class="prog-linha" data-acao="abrir" data-disc="' + esc(d.id) + '" type="button">' +
          '<span class="prog-nome"><i class="dot" style="background:' + esc(d.cor) + '"></i><span>' + esc(d.nome) + "</span></span>" +
          '<span class="barra"><i style="width:' + pct + "%;background:" + esc(d.cor) + '"></i></span>' +
          '<span class="prog-num num">' + dadas + "/" + todas.length + (comNota ? " · " + comNota + " ✎" : "") + "</span>" +
          "</button>";
      }).join("") + "</div>" +
      (disciplinasArquivadas().length
        ? '<p style="margin-top:12px"><button class="acao-discreta" data-acao="abrir-arquivadas" type="button">Ver arquivadas · ' + disciplinasArquivadas().length + "</button></p>"
        : "") +
      "</section>";

    return html;
  }

  function htmlResumoItem(numero, rotulo, classe) {
    return '<div class="resumo-item' + (classe ? " " + classe : "") + '"><strong class="num">' + numero + "</strong><span>" + esc(rotulo) + "</span></div>";
  }

  function htmlSemana() {
    if (!estado.pronto) return '<p class="eyebrow">Carregando…</p>';
    const ativas = disciplinasAtivas();
    if (!ativas.length) {
      return htmlAvisoArmazenamento() +
        '<div class="page-head"><span class="eyebrow">Semana</span><h1>Comece pelo plano de ensino</h1>' +
        "<p>Importe o cronograma de uma disciplina para ver aqui o panorama da semana: aulas, pendências e provas.</p></div>" +
        '<div class="vazio"><h3>Nenhuma disciplina ainda</h3><p>Abra a nota do plano de ensino no Obsidian, copie o cronograma e cole aqui.</p>' +
        '<button class="btn btn-primary" data-acao="importar" type="button">Importar plano de ensino</button></div>';
    }

    // disciplinas com aula hoje, já com o recorte anterior/próxima calculado
    const hoje = ativas
      .map((d) => ({ d: d, corte: recorte(d.id) }))
      .filter((x) => x.corte.proxima && x.corte.proxima.data === HOJE);

    const fimSemana = isoDe(new Date(dataDe(HOJE).getTime() + 6 * 86400000));

    // aulas marcadas como prova nos próximos 7 dias (hoje incluído)
    const provas = [];
    ativas.forEach((d) => {
      aulasDe(d.id).forEach((a) => {
        if (a.data < HOJE || a.data > fimSemana) return;
        if ((a.tags || []).some((t) => chave(t).indexOf("prova") !== -1)) provas.push({ d: d, aula: a });
      });
    });
    provas.sort((a, b) => (a.aula.data < b.aula.data ? -1 : 1));

    // o restante da semana (amanhã até 6 dias à frente), sem repetir a aula de hoje
    const restoSemana = proximas(200).filter((a) => a.data > HOJE && a.data <= fimSemana);

    // qualquer aula (passada ou futura) ainda marcada como conteúdo pendente, em toda disciplina ativa
    const pendentesEnsino = [];
    ativas.forEach((d) => {
      aulasDe(d.id).forEach((a) => { if (a.incompleta) pendentesEnsino.push({ d: d, a: a }); });
    });
    pendentesEnsino.sort((x, y) => (x.a.data < y.a.data ? -1 : 1));

    const pendenciasHoje = hoje.filter((x) => {
      const anterior = x.corte.anteriores[x.corte.anteriores.length - 1];
      return anterior && anterior.incompleta;
    }).length;

    let html = htmlAvisoArmazenamento() +
      '<div class="page-head"><span class="eyebrow">Semana</span><h1>' + esc(dataExtenso(HOJE)) + " até " + esc(dataCurta(fimSemana)) + "</h1></div>";

    html += '<div class="resumo-dia">' +
      htmlResumoItem(hoje.length, hoje.length === 1 ? "aula hoje" : "aulas hoje", "") +
      htmlResumoItem(pendentesEnsino.length, pendentesEnsino.length === 1 ? "conteúdo pendente" : "conteúdos pendentes", pendentesEnsino.length ? "alerta" : "") +
      htmlResumoItem(provas.length, provas.length === 1 ? "prova esta semana" : "provas esta semana", provas.length ? "alerta" : "") +
      "</div>";

    if (provas.length) {
      html += '<section style="margin-top:30px"><h2>Provas da semana</h2><div class="provas-lista">' +
        provas.map((p) => htmlProvaCard(p.d, p.aula)).join("") +
        "</div></section>";
    }

    html += '<section style="margin-top:30px"><h2>Hoje</h2>';
    if (!hoje.length) {
      const prox = proximas(1)[0];
      const dProx = prox ? porId(estado.disciplinas, prox.disciplinaId) : null;
      html += '<div class="vazio"><h3>Nenhuma aula hoje</h3><p>' +
        (prox
          ? "Sua próxima aula é " + esc(dProx ? dProx.nome : "") + ", " + esc(distancia(prox.data)) + "."
          : "Não há mais aulas futuras no cronograma.") +
        "</p></div>";
    } else {
      html += hoje.map((x) => htmlDisciplinaSemana(x.d, x.corte)).join("");
    }
    html += "</section>";

    if (restoSemana.length) {
      html += '<section style="margin-top:30px"><h2>Resto da semana</h2>' + htmlAgenda(restoSemana) + "</section>";
    }

    if (pendentesEnsino.length && pendenciasHoje !== pendentesEnsino.length) {
      // já mostrei as de hoje no alerta de cada card; aqui listo o conjunto completo,
      // incluindo as que não têm aula hoje pra lembrar
      html += '<section style="margin-top:30px"><h2>Conteúdo pendente</h2><div class="pendencias-lista">' +
        pendentesEnsino.map((x) => htmlPendenciaEnsino(x.d, x.a)).join("") +
        "</div></section>";
    }

    html += '<section style="margin-top:30px"><h2>Reuniões da semana</h2>' +
      '<div class="aviso-info">Conecte o Google Calendar em <strong>claude.ai → Configurações → Conectores</strong> pra ver aqui os compromissos da semana.</div></section>';

    html += '<section style="margin-top:30px"><h2>Pendências gerais</h2>' +
      '<div class="aviso-info">Ainda não há uma tarefa configurada pra trazer as pendências dos seus resumos semanais do Obsidian.</div></section>';

    return html;
  }

  function htmlPendenciaEnsino(d, a) {
    return '<div class="alerta-pendente-compacto"><span><i class="dot-inline" style="background:' + esc(d.cor) + '"></i>' +
      "<strong>" + esc(d.nome) + "</strong> · aula de " + esc(dataCurta(a.data)) + ": " + esc(a.assunto) +
      (temNota(a) ? " — última nota: “" + esc(a.notas[a.notas.length - 1].texto) + "”" : "") +
      "</span>" +
      '<button class="acao-discreta" data-acao="abrir" data-disc="' + esc(d.id) + '" type="button">Ver disciplina</button></div>';
  }

  function htmlDisciplinaSemana(d, corte) {
    const sala = salaDe(d);
    const anterior = corte.anteriores[corte.anteriores.length - 1];
    let html = '<div class="dia-disciplina">' +
      '<div class="dia-disciplina-cabecalho"><i class="dot" style="background:' + esc(d.cor) + '"></i><strong>' + esc(d.nome) + "</strong></div>";

    if (anterior && anterior.incompleta) {
      html += '<div class="alerta-pendente-compacto"><span>⚠ A aula anterior (' + esc(dataCurta(anterior.data)) + ") ficou com conteúdo pendente: <strong>" + esc(anterior.assunto) + "</strong>" +
        (temNota(anterior) ? " — última nota: “" + esc(anterior.notas[anterior.notas.length - 1].texto) + "”" : "") +
        "</span>" +
        '<button class="acao-discreta" data-acao="abrir" data-disc="' + esc(d.id) + '" type="button">Ver disciplina</button></div>';
    }

    html += '<div class="aulas">' + htmlAula(corte.proxima, "hoje", sala) + "</div></div>";
    return html;
  }

  function htmlProvaCard(d, aula) {
    return '<div class="prova-card">' +
      '<div class="prova-cabecalho"><i class="dot" style="background:' + esc(d.cor) + '"></i><strong>' + esc(d.nome) + "</strong>" +
      '<span class="prova-quando">' + esc(dataExtenso(aula.data)) + (faixaHora(aula) ? " · " + esc(faixaHora(aula)) : "") + " · " + esc(distancia(aula.data)) + "</span></div>" +
      '<p class="prova-detalhe">' + esc(aula.assunto) + (salaDe(d) ? " · " + esc(salaDe(d)) : "") + "</p>" +
      '<button class="btn btn-sm" data-acao="copiar-resumo-prova" data-disc="' + esc(d.id) + '" data-aula="' + esc(aula.id) + '" type="button">Copiar resumo do conteúdo</button>' +
      "</div>";
  }

  // texto pronto pra colar numa conversa com o Claude junto do banco de questões: o conteúdo
  // dado desde a última aula marcada como prova nesta disciplina (ou desde o início, se for a primeira)
  function resumoProva(d, provaAula) {
    const todas = aulasDe(d.id).filter((a) => a.data < provaAula.data);
    let desde = null;
    for (let i = todas.length - 1; i >= 0; i--) {
      if ((todas[i].tags || []).some((t) => chave(t).indexOf("prova") !== -1)) { desde = todas[i]; break; }
    }
    const cobertos = desde ? todas.filter((a) => a.data > desde.data) : todas;

    let texto = "Prova de " + d.nome + " — " + dataExtenso(provaAula.data) + (faixaHora(provaAula) ? ", " + faixaHora(provaAula) : "") + ".\n";
    if (salaDe(d)) texto += "Local: " + salaDe(d) + "\n";
    texto += "\nConteúdo " + (desde ? "desde a última prova (" + dataCurta(desde.data) + ")" : "dado até aqui") + ":\n";
    texto += cobertos.length
      ? cobertos.map((a) => "- " + dataCurta(a.data) + ": " + a.assunto + (a.tags && a.tags.length ? " [" + a.tags.join(", ") + "]" : "")).join("\n")
      : "(nenhuma aula registrada nesse intervalo)";
    texto += "\n";
    return texto;
  }

  function htmlArquivadas() {
    const arquivadas = disciplinasArquivadas().sort((a, b) => (a.criadoEm || 0) - (b.criadoEm || 0));
    let html = '<div class="page-head"><span class="eyebrow">Arquivadas</span><h1>Disciplinas arquivadas</h1>' +
      "<p>Ficam fora das abas e do painel, mas os dados continuam guardados — reative quando precisar.</p></div>";

    if (!arquivadas.length) {
      html += '<div class="vazio"><h3>Nenhuma disciplina arquivada</h3><p>Disciplinas encerradas podem ser arquivadas na própria aba, sem apagar o histórico.</p></div>';
      return html;
    }

    html += arquivadas.map((d) => {
      const meta = [d.curso, d.codigo].filter(Boolean).join(" · ") || (aulasDe(d.id).length + " aulas no cronograma");
      return '<div class="arquivada-linha">' +
        '<span class="arquivada-info"><i class="dot" style="background:' + esc(d.cor) + '"></i><strong>' + esc(d.nome) + "</strong><span>" + esc(meta) + "</span></span>" +
        '<span class="arquivada-acoes">' +
        '<button class="btn btn-sm" data-acao="abrir" data-disc="' + esc(d.id) + '" type="button">Ver</button>' +
        '<button class="btn btn-sm btn-primary" data-acao="reativar-disc" data-disc="' + esc(d.id) + '" type="button">Reativar</button>' +
        "</span></div>";
    }).join("");

    return html;
  }

  function htmlAgenda(lista) {
    const grupos = [];
    lista.forEach((a) => {
      const ultimo = grupos[grupos.length - 1];
      if (ultimo && ultimo.data === a.data) ultimo.itens.push(a);
      else grupos.push({ data: a.data, itens: [a] });
    });
    return grupos.map((g) => {
      const p = partes(g.data);
      return '<div class="dia-grupo">' +
        '<div class="dia-label' + (g.data === HOJE ? " hoje" : "") + '"><strong>' + esc(p.dowLongo.replace("-feira", "")) + ", " + (+p.dia) + " de " + esc(p.mesLongo) + "</strong><span>" + esc(distancia(g.data)) + "</span></div>" +
        g.itens.map((a) => {
          const d = porId(estado.disciplinas, a.disciplinaId);
          return '<button class="linha" data-acao="abrir" data-disc="' + esc(a.disciplinaId) + '" type="button">' +
            '<span class="hora num">' + esc(a.inicio || "—") + "</span>" +
            '<span class="conteudo"><span class="assunto">' + esc(a.assunto) + "</span>" +
            '<span class="disc"><i class="dot" style="background:' + esc(d ? d.cor : "#888") + '"></i>' + esc(d ? d.nome : "Disciplina") + (salaDe(d) ? " · " + esc(salaDe(d)) : "") + "</span>" +
            (a.tags && a.tags.length ? '<span class="linha-tags">' + a.tags.map((t) => '<span class="badge-mini">' + esc(t) + "</span>").join("") + "</span>" : "") +
            "</span>" +
            '<span class="seta">›</span></button>';
        }).join("") +
        "</div>";
    }).join("");
  }

  function htmlDisciplina(d) {
    if (!d) return htmlPainel();
    const corte = recorte(d.id);
    const todas = aulasDe(d.id);
    const cartoes = [];
    const sala = salaDe(d);
    corte.anteriores.forEach((a) => cartoes.push(htmlAula(a, "passada", sala)));
    if (corte.proxima) cartoes.push(htmlAula(corte.proxima, corte.proxima.data === HOJE ? "hoje" : "proxima", sala));

    const etiqueta = [d.curso, d.codigo, d.horario].filter(Boolean).join(" · ") || "Disciplina";
    let html = htmlAvisoArmazenamento() +
      '<div class="page-head"><span class="eyebrow" style="color:' + esc(d.cor) + '">' +
      esc(etiqueta) + "</span><h1>" + esc(d.nome) + (d.arquivada ? ' <span class="pill pill-passada" style="vertical-align:middle">Arquivada</span>' : "") + "</h1>" +
      "<p>" + (corte.proxima
        ? "A próxima aula é " + esc(distancia(corte.proxima.data)) + ". Abaixo dela, as duas anteriores — registre o que aconteceu enquanto está fresco."
        : "Todas as aulas do cronograma já aconteceram. Estas são as últimas.") +
      '</p><div class="head-acoes">' +
      '<button class="btn btn-sm" data-acao="editar-disc" data-disc="' + esc(d.id) + '" type="button">Editar disciplina</button>' +
      '<button class="btn btn-sm" data-acao="reimportar" data-disc="' + esc(d.id) + '" type="button">Atualizar cronograma</button>' +
      "</div></div>";

    html += cartoes.length
      ? '<div class="aulas">' + cartoes.join("") + "</div>"
      : '<div class="vazio"><h3>Sem aulas no cronograma</h3><p>Importe o plano de ensino outra vez para preencher as datas desta disciplina.</p>' +
        '<button class="btn btn-primary" data-acao="importar" type="button">Importar plano</button></div>';

    if (todas.length) {
      html += '<details class="crono"' + (estado.todasAsAulas ? " open" : "") + '><summary data-acao="alternar-crono">Cronograma completo · ' + todas.length + " aulas</summary>" +
        '<div class="crono-tabela"><table><thead><tr><th>Data</th><th>Horário</th><th>Assunto</th><th>Unidade</th><th>Anotações</th></tr></thead><tbody>' +
        todas.map((a) => {
          const classe = a.data < HOJE ? "feita" : (corte.proxima && a.id === corte.proxima.id ? "atual" : "");
          return '<tr class="' + classe + '"><td class="data">' + esc(dataCurta(a.data)) + "</td>" +
            '<td class="data">' + celulaEditavel(a, "horario", faixaHora(a) || "—", faixaHora(a) || "") + "</td>" +
            "<td>" + celulaEditavel(a, "assunto", a.assunto, a.assunto) + htmlIndicadoresLinha(a) + "</td>" +
            '<td class="' + (a.unidade ? "" : "vazia") + '">' + celulaEditavel(a, "unidade", a.unidade || "—", a.unidade || "") + "</td>" +
            '<td class="num">' + (temNota(a) ? a.notas.length : "—") + "</td></tr>";
        }).join("") +
        "</tbody></table></div></details>";
    }

    html += '<div class="folha-acoes" style="margin-top:26px">' +
      '<button class="btn btn-sm" data-acao="exportar-disc" data-disc="' + esc(d.id) + '" type="button">Exportar esta disciplina</button>' +
      '<button class="btn btn-sm" data-acao="verificar-duplicatas" data-disc="' + esc(d.id) + '" type="button">Verificar duplicatas</button>' +
      '<div class="direita">' +
      (d.arquivada
        ? '<button class="btn btn-sm" data-acao="reativar-disc" data-disc="' + esc(d.id) + '" type="button">Reativar disciplina</button>'
        : '<button class="btn btn-sm" data-acao="arquivar-disc" data-disc="' + esc(d.id) + '" type="button">Arquivar disciplina</button>') +
      '<button class="btn btn-sm btn-quiet" data-acao="remover-disc" data-disc="' + esc(d.id) + '" type="button">Remover disciplina</button>' +
      "</div>" +
      "</div>";

    return html;
  }

  function htmlAula(a, estadoAula, sala) {
    const p = partes(a.data);
    const rotulo = estadoAula === "hoje" ? '<span class="pill pill-hoje">Aula de hoje</span>'
      : estadoAula === "proxima" ? '<span class="pill pill-proxima">Próxima aula</span>'
      : '<span class="pill pill-passada">' + esc(distancia(a.data)) + "</span>";
    const aberto = estado.abertos.has(a.id);
    const rascunho = estado.rascunhos[a.id] || "";

    return '<article class="aula" data-estado="' + estadoAula + '" data-aula="' + esc(a.id) + '">' +
      '<div class="cal"><span class="dow">' + esc(p.dow) + '</span><span class="dia">' + esc(p.dia) + '</span><span class="mes">' + esc(p.mes) + "</span></div>" +
      "<div>" +
      '<div class="aula-meta">' + rotulo +
      (faixaHora(a) ? '<span class="hora">' + esc(faixaHora(a)) + "</span>" : "") +
      (sala ? '<span class="sala">' + esc(sala) + "</span>" : "") +
      (temNota(a) ? '<span class="pill pill-nota">' + a.notas.length + (a.notas.length > 1 ? " anotações" : " anotação") + "</span>" : "") +
      (a.incompleta
        ? '<button class="pill pill-alerta" data-acao="alternar-incompleta" data-aula="' + esc(a.id) + '" type="button" title="Clique para marcar como concluído">⚠ Conteúdo pendente</button>'
        : '<button class="acao-discreta" data-acao="alternar-incompleta" data-aula="' + esc(a.id) + '" type="button">Marcar conteúdo pendente</button>') +
      "</div>" +
      "<h3>" + esc(a.assunto) + "</h3>" +
      htmlEtiquetas(a) +
      (temNota(a) ? '<div class="notas">' + a.notas.map((n) => htmlNota(a, n)).join("") + "</div>" : "") +
      (aberto
        ? '<div class="compositor">' +
          '<textarea class="auto" data-foco="nota-' + esc(a.id) + '" data-campo-nota="' + esc(a.id) + '" rows="3" placeholder="O que aconteceu nesta aula? Conteúdo dado, ritmo da turma, pendências…">' + esc(rascunho) + "</textarea>" +
          '<div class="compositor-acoes">' +
          '<button class="btn btn-sm btn-primary" data-acao="salvar-nota" data-aula="' + esc(a.id) + '" type="button">Salvar anotação</button>' +
          '<button class="btn btn-sm btn-quiet" data-acao="cancelar-nota" data-aula="' + esc(a.id) + '" type="button">Cancelar</button>' +
          '<span class="dica">⌘/Ctrl + Enter para salvar</span>' +
          "</div></div>"
        : '<div class="compositor"><div><button class="btn btn-sm" data-acao="abrir-nota" data-aula="' + esc(a.id) + '" type="button">＋ Adicionar comentário</button></div></div>') +
      "</div></article>";
  }

  function htmlNota(a, n) {
    return '<div class="nota"><div><p>' + esc(n.texto) + "</p><time>" + esc(carimbo(n.em)) + "</time></div>" +
      '<button class="apagar" data-acao="apagar-nota" data-aula="' + esc(a.id) + '" data-nota="' + esc(n.id) + '" type="button" aria-label="Apagar anotação" title="Apagar anotação">✕</button></div>';
  }

  // selo de conteúdo pendente + etiquetas, exibidos junto do assunto no cronograma completo
  function htmlIndicadoresLinha(a) {
    const tags = a.tags || [];
    if (!a.incompleta && !tags.length) return "";
    return '<div class="linha-indicadores">' +
      (a.incompleta ? '<span class="badge-mini badge-alerta">⚠ Pendente</span>' : "") +
      tags.map((t) => '<span class="badge-mini">' + esc(t) + "</span>").join("") +
      "</div>";
  }

  const SUGESTOES_ETIQUETA = ["Prova", "Revisão", "Aula prática", "Trabalho", "Seminário"];

  // fileira de etiquetas de uma aula: os chips existentes, e o botão ou o editor para adicionar
  function htmlEtiquetas(a) {
    const tags = a.tags || [];
    const chips = tags.map((t) =>
      '<span class="etiqueta">' + esc(t) +
      '<button data-acao="remover-etiqueta" data-aula="' + esc(a.id) + '" data-etiqueta="' + esc(t) + '" type="button" aria-label="Remover etiqueta ' + esc(t) + '">✕</button></span>'
    ).join("");

    if (!estado.etiquetasAbertas.has(a.id)) {
      return '<div class="etiquetas">' + chips +
        '<button class="etiqueta-add" data-acao="abrir-etiqueta" data-aula="' + esc(a.id) + '" type="button">+ etiqueta</button></div>';
    }

    return '<div class="etiquetas">' + chips +
      '<div class="etiqueta-editor">' +
      '<input type="text" class="etiqueta-input" data-foco="etiqueta-' + esc(a.id) + '" data-campo-etiqueta="' + esc(a.id) + '" placeholder="Nome da etiqueta">' +
      SUGESTOES_ETIQUETA.filter((s) => !tags.some((t) => chave(t) === chave(s))).map((s) =>
        '<button class="etiqueta-sugestao" data-acao="sugestao-etiqueta" data-aula="' + esc(a.id) + '" data-valor="' + esc(s) + '" type="button">' + esc(s) + "</button>"
      ).join("") +
      '<button class="celula-ok" data-acao="confirmar-etiqueta" data-aula="' + esc(a.id) + '" type="button" aria-label="Adicionar etiqueta" title="Adicionar">✓</button>' +
      '<button class="celula-cancelar" data-acao="cancelar-etiqueta" data-aula="' + esc(a.id) + '" type="button" aria-label="Cancelar" title="Cancelar">✕</button>' +
      "</div></div>";
  }

  function abrirEtiqueta(aulaId) {
    estado.etiquetasAbertas.add(aulaId);
    agendarDesenho();
    setTimeout(() => {
      const campo = document.querySelector('[data-campo-etiqueta="' + aulaId + '"]');
      if (campo) campo.focus();
    }, 20);
  }

  function fecharEtiqueta(aulaId) {
    estado.etiquetasAbertas.delete(aulaId);
    agendarDesenho();
  }

  async function adicionarEtiqueta(aulaId, valorBruto) {
    const texto = String(valorBruto || "").trim();
    if (!texto) { fecharEtiqueta(aulaId); return; }
    const aula = porId(estado.aulas, aulaId);
    if (!aula) return;
    const atuais = aula.tags || [];
    if (atuais.some((t) => chave(t) === chave(texto))) {
      fecharEtiqueta(aulaId);
      avisar("Essa etiqueta já está nesta aula.");
      return;
    }
    fecharEtiqueta(aulaId);
    await salvarAula(Object.assign({}, aula, { tags: atuais.concat([texto]) }));
    agendarDesenho();
  }

  async function removerEtiqueta(aulaId, etiqueta) {
    const aula = porId(estado.aulas, aulaId);
    if (!aula) return;
    await salvarAula(Object.assign({}, aula, { tags: (aula.tags || []).filter((t) => t !== etiqueta) }));
    agendarDesenho();
  }

  async function alternarIncompleta(aulaId) {
    const aula = porId(estado.aulas, aulaId);
    if (!aula) return;
    await salvarAula(Object.assign({}, aula, { incompleta: !aula.incompleta }));
    agendarDesenho();
  }

  function ajustarAltura(area) {
    area.style.height = "auto";
    area.style.height = Math.min(area.scrollHeight + 2, 320) + "px";
  }

  // uma célula do cronograma completo: texto clicável, ou o editor quando é a célula ativa
  function celulaEditavel(a, campo, exibicao, valorBruto) {
    const ed = estado.editandoCelula;
    if (ed && ed.aula === a.id && ed.campo === campo) {
      const foco = "cel-" + a.id + "-" + campo;
      return '<div class="celula-editor">' +
        '<input type="text" class="celula-input" data-foco="' + foco + '" data-aula="' + esc(a.id) + '" data-campo="' + campo + '" value="' + esc(valorBruto) + '">' +
        '<div class="celula-acoes">' +
        '<button class="celula-ok" data-acao="salvar-celula" data-aula="' + esc(a.id) + '" data-campo="' + campo + '" type="button" aria-label="Salvar" title="Salvar">✓</button>' +
        '<button class="celula-cancelar" data-acao="cancelar-celula" type="button" aria-label="Cancelar edição" title="Cancelar">✕</button>' +
        "</div></div>";
    }
    return '<button class="cel-editavel" data-acao="editar-celula" data-aula="' + esc(a.id) + '" data-campo="' + campo + '" type="button">' + esc(exibicao) + "</button>";
  }

  function abrirEdicaoCelula(aulaId, campo) {
    estado.editandoCelula = { aula: aulaId, campo: campo };
    agendarDesenho();
    setTimeout(() => {
      const entrada = document.querySelector('[data-foco="cel-' + aulaId + '-' + campo + '"]');
      if (entrada) { entrada.focus(); entrada.select(); }
    }, 20);
  }

  function fecharEdicaoCelula() {
    estado.editandoCelula = null;
    agendarDesenho();
  }

  const ROTULO_CAMPO = { horario: "o horário", assunto: "o assunto", unidade: "a unidade" };

  // salva o valor de uma célula do cronograma; se outras aulas da disciplina caem no mesmo
  // dia da semana e horário (antes desta edição), oferece aplicar a mesma mudança a todas
  async function salvarCampoCronograma(aulaId, campo, valorBruto) {
    const aula = porId(estado.aulas, aulaId);
    if (!aula) { fecharEdicaoCelula(); return; }

    let patch;
    if (campo === "horario") {
      const texto = valorBruto.trim();
      if (!texto) patch = { inicio: null, fim: null };
      else {
        const hr = lerHorario(texto);
        if (!hr) { avisar("Não entendi esse horário. Use algo como 19:00–20:40."); return; }
        patch = { inicio: hr.inicio, fim: hr.fim || null };
      }
    } else if (campo === "assunto") {
      const texto = valorBruto.trim();
      if (!texto) { avisar("O assunto não pode ficar em branco."); return; }
      patch = { assunto: texto };
    } else if (campo === "unidade") {
      patch = { unidade: valorBruto.trim() };
    } else { fecharEdicaoCelula(); return; }

    const mudou = Object.keys(patch).some((k) => (aula[k] || "") !== (patch[k] || ""));
    if (!mudou) { fecharEdicaoCelula(); return; }

    // outras aulas da mesma disciplina no mesmo dia da semana e horário — calculado
    // com os valores ANTERIORES à edição, então aplica-se mesmo quando o campo é o horário
    const diaSemana = dataDe(aula.data).getDay();
    const irmas = estado.aulas.filter((x) =>
      x.id !== aula.id &&
      x.disciplinaId === aula.disciplinaId &&
      dataDe(x.data).getDay() === diaSemana &&
      (x.inicio || "") === (aula.inicio || "") &&
      (x.fim || "") === (aula.fim || "")
    );

    fecharEdicaoCelula();
    await salvarAula(Object.assign({}, aula, patch));

    if (irmas.length) {
      const p = partes(aula.data);
      const ok = await perguntar(
        "Aplicar às demais aulas?",
        "Encontrei " + irmas.length + (irmas.length > 1 ? " outras aulas" : " outra aula") + " de " + p.dowLongo.replace("-feira", "") +
          (faixaHora(aula) ? ", " + faixaHora(aula) : " sem horário definido") + ". Também mudar " + ROTULO_CAMPO[campo] + " delas?",
        "Aplicar a " + (irmas.length + 1) + " aulas"
      );
      if (ok) { for (const x of irmas) { await salvarAula(Object.assign({}, x, patch)); } }
      agendarDesenho();
      avisar(ok ? "Alterado em " + (irmas.length + 1) + " aulas." : "Alterado só nesta aula.");
    } else {
      agendarDesenho();
      avisar("Aula atualizada.");
    }
  }

  /* ============================================================
     importador
     ============================================================ */

  const imp = { plano: null, cor: CORES[0], alvo: null };

  function abrirImportador(discId) {
    const d = discId ? porId(estado.disciplinas, discId) : null;
    imp.alvo = d ? d.id : null;
    imp.cor = d ? (d.cor || CORES[estado.disciplinas.length % CORES.length]) : CORES[estado.disciplinas.length % CORES.length];

    $("#titulo-importador").textContent = d ? "Atualizar cronograma" : "Importar plano de ensino";
    $("#entrada").value = "";
    $("#campo-nome").value = d ? d.nome : "";
    $("#campo-horario").value = d ? (d.horario || "") : "";
    $("#campo-ano").value = new Date().getFullYear();
    desenharCores("#cores", imp.cor, "data-cor");
    $("#capa-importador").hidden = false;
    document.body.style.overflow = "hidden";
    atualizarPrevia();
    setTimeout(() => $("#entrada").focus(), 30);
  }

  function fecharImportador() {
    $("#capa-importador").hidden = true;
    document.body.style.overflow = "";
    imp.plano = null;
    imp.alvo = null;
  }

  function desenharCores(seletor, selecionada, atributo) {
    $(seletor).innerHTML = CORES.map((c) =>
      '<button class="cor-op" type="button" ' + atributo + '="' + c + '" aria-pressed="' + (c === selecionada) + '" aria-label="Cor ' + c + '" style="background:' + c + '"></button>'
    ).join("");
  }

  function atualizarPrevia() {
    const texto = $("#entrada").value;
    const ano = +$("#campo-ano").value || new Date().getFullYear();
    const plano = lerPlano(texto, ano);
    imp.plano = plano;

    if (plano.nome && !$("#campo-nome").value.trim()) $("#campo-nome").value = plano.nome;
    if (plano.horario && !$("#campo-horario").value.trim()) $("#campo-horario").value = plano.horario;

    const caixa = $("#previa");
    const total = plano.aulas.length;

    if (!texto.trim()) {
      caixa.innerHTML = '<p style="margin:0;font-size:13px;color:var(--ink-3)">A prévia das aulas aparece aqui assim que você colar o plano.</p>';
      $("#btn-confirmar").disabled = true;
      return;
    }
    if (!total) {
      caixa.innerHTML = '<p style="margin:0;font-size:13px;color:var(--warm)">Não encontrei nenhuma aula com data. Verifique se cada aula tem uma data no começo da linha ou uma coluna <strong>Data</strong> na tabela.</p>';
      $("#btn-confirmar").disabled = true;
      return;
    }

    const semHora = plano.aulas.filter((a) => !a.inicio).length;
    caixa.innerHTML =
      '<div class="previa-topo"><strong>' + total + (total > 1 ? " aulas encontradas" : " aula encontrada") + "</strong>" +
      '<span style="font-size:12.5px;color:var(--ink-3)">' + esc(dataCurta(plano.aulas[0].data)) + " a " + esc(dataCurta(plano.aulas[total - 1].data)) + "</span></div>" +
      '<div class="previa-lista"><table><thead><tr><th>Data</th><th>Horário</th><th>Assunto</th><th>Unidade</th></tr></thead><tbody>' +
      plano.aulas.map((a) =>
        '<tr><td class="data">' + esc(dataCurta(a.data)) + '</td><td class="data">' + esc(faixaHora(a) || "—") + "</td><td>" + esc(a.assunto) + "</td><td>" + esc(a.unidade || "—") + "</td></tr>"
      ).join("") +
      "</tbody></table></div>" +
      (plano.ignoradas ? '<p class="aviso">' + plano.ignoradas + (plano.ignoradas > 1 ? " linhas foram ignoradas" : " linha foi ignorada") + " por não ter data ou assunto.</p>" : "") +
      (plano.duplicadas ? '<p class="aviso">' + plano.duplicadas + (plano.duplicadas > 1 ? " linhas repetidas foram descartadas" : " linha repetida foi descartada") + " (mesma data, horário e assunto).</p>" : "") +
      (semHora ? '<p class="aviso">' + semHora + (semHora > 1 ? " aulas ficam" : " aula fica") + " com o horário padrão informado acima.</p>" : "");

    $("#btn-confirmar").disabled = false;
    $("#btn-confirmar").textContent = (imp.alvo ? "Atualizar " : "Importar ") + total + (total > 1 ? " aulas" : " aula");
  }

  async function confirmarImportacao() {
    const plano = imp.plano;
    if (!plano || !plano.aulas.length) return;

    const nome = $("#campo-nome").value.trim() || plano.nome || "Nova disciplina";
    const horario = $("#campo-horario").value.trim();
    const padrao = horario ? lerHorario(horario) : null;

    let disciplina = imp.alvo ? porId(estado.disciplinas, imp.alvo) : null;
    if (!disciplina) {
      disciplina = estado.disciplinas.find((d) => chave(d.nome) === chave(nome)) || null;
    }
    const novaDisc = !disciplina;
    disciplina = Object.assign({}, disciplina || { id: id(), criadoEm: Date.now() }, { nome: nome, horario: horario, cor: imp.cor });
    if (!disciplina.curso && plano.curso) disciplina.curso = plano.curso;
    if (!disciplina.codigo && plano.codigo) disciplina.codigo = plano.codigo;
    if (!disciplina.sala && plano.sala) disciplina.sala = plano.sala;

    const anteriores = novaDisc ? [] : aulasDe(disciplina.id);
    const porData = {};
    const porAssunto = {};
    anteriores.forEach((a) => {
      if (temNota(a)) { porData[a.data] = a; porAssunto[chave(a.assunto)] = a; }
    });

    const novas = plano.aulas.map((a, i) => {
      const herda = porData[a.data] || porAssunto[chave(a.assunto)] || null;
      return {
        id: (herda && herda.id) || id(),
        disciplinaId: disciplina.id,
        data: a.data,
        inicio: a.inicio || (padrao ? padrao.inicio : null),
        fim: a.fim || (padrao ? padrao.fim : null),
        assunto: a.assunto,
        unidade: a.unidade || "",
        ordem: i,
        notas: (herda && herda.notas) || []
      };
    });

    const mantidos = new Set(novas.map((a) => a.id));
    const remover = anteriores.filter((a) => !mantidos.has(a.id));

    await salvarDisciplina(disciplina);
    for (const a of remover) { await apagarAula(a); }
    for (const a of novas) { await salvarAula(a); }

    const herdadas = novas.filter((a) => a.notas.length).length;
    estado.aba = disciplina.id;
    fecharImportador();
    agendarDesenho();
    avisar(novas.length + (novas.length > 1 ? " aulas importadas" : " aula importada") +
      (herdadas ? " · " + herdadas + (herdadas > 1 ? " aulas mantiveram suas anotações" : " aula manteve suas anotações") : ""));
  }

  function exemplo() {
    const base = new Date();
    const assuntos = [
      ["1", "Integral indefinida: primitivas e notação"],
      ["1", "Técnicas de integração: substituição"],
      ["1", "Integração por partes"],
      ["2", "Integral definida e o Teorema Fundamental do Cálculo"],
      ["2", "Áreas entre curvas"],
      ["2", "Volumes por discos e cascas cilíndricas"],
      ["3", "Integrais impróprias"],
      ["3", "Sequências e séries numéricas"]
    ];
    // aulas semanais: três já aconteceram, a próxima é a mais recente à frente de hoje
    const inicio = new Date(base.getFullYear(), base.getMonth(), base.getDate() - 21);
    let unidadeAtual = "";
    let texto = "---\ndisciplina: Cálculo Diferencial e Integral II\nhorario: 19:00–20:40\n---\n\n# Cálculo Diferencial e Integral II\n";
    assuntos.forEach((par, i) => {
      const d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i * 7);
      if (par[0] !== unidadeAtual) {
        unidadeAtual = par[0];
        texto += "\n## Unidade " + unidadeAtual + "\n\n| Data | Horário | Assunto |\n| --- | --- | --- |\n";
      }
      texto += "| " + String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear() +
        " | 19:00–20:40 | " + par[1] + " |\n";
    });
    return texto;
  }

  /* ============================================================
     exportação para o Obsidian
     ============================================================ */

  function markdownDe(discId) {
    const alvos = discId ? [porId(estado.disciplinas, discId)].filter(Boolean) : estado.disciplinas.slice();
    const agora = new Date();
    let md = "---\ntipo: diario-de-aulas\nexportado: " + isoDe(agora) + "\n---\n\n";
    md += "# Diário de aulas\n\n> Exportado em " + dataCurta(isoDe(agora)) + ".\n";

    alvos.forEach((d) => {
      const lista = aulasDe(d.id);
      md += "\n## " + d.nome + "\n";
      const ficha = [];
      if (d.curso) ficha.push("*Curso:* " + d.curso);
      if (d.codigo) ficha.push("*Turma:* " + d.codigo);
      if (d.horario) ficha.push("*Horário:* " + d.horario);
      if (salaDe(d)) ficha.push("*Sala:* " + salaDe(d));
      if (ficha.length) md += "\n" + ficha.join(" · ") + "\n";
      let unidade = null;
      lista.forEach((a) => {
        if ((a.unidade || "") !== unidade) {
          unidade = a.unidade || "";
          if (unidade) md += "\n### " + unidade + "\n";
        }
        md += "\n**" + dataCurta(a.data) + "**" + (faixaHora(a) ? " · " + faixaHora(a) : "") + " — " + a.assunto +
          (a.incompleta ? " ⚠ *conteúdo não concluído*" : "") + "\n";
        if (a.tags && a.tags.length) md += "*Etiquetas:* " + a.tags.join(", ") + "\n";
        if (temNota(a)) {
          a.notas.forEach((n) => {
            md += "- " + String(n.texto).replace(/\n+/g, " ") + "  <!-- " + carimbo(n.em) + " -->\n";
          });
        }
      });
      md += "\n";
    });
    return md;
  }

  async function exportar(discId) {
    const md = markdownDe(discId);
    const d = discId ? porId(estado.disciplinas, discId) : null;
    const nomeArquivo = "diario-" + (d ? chave(d.nome).replace(/\s+/g, "-") : "todas-as-disciplinas") + ".md";

    let baixar = null;
    try { baixar = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }
    catch (e) { baixar = null; }

    if (baixar) {
      try {
        await baixar.save({ filename: nomeArquivo, data: md });
        avisar("Arquivo salvo — arraste para o seu vault.");
        return;
      } catch (e) {
        if (e && e.code === "declined") return;
      }
    }
    try {
      await navigator.clipboard.writeText(md);
      avisar("Markdown copiado — cole em uma nota do Obsidian.");
    } catch (e) {
      avisar("Não consegui exportar agora. Tente novamente em instantes.");
    }
  }

  /* ============================================================
     interação
     ============================================================ */

  const editor = { id: null, cor: CORES[0] };

  function abrirEditor(discId) {
    const d = porId(estado.disciplinas, discId);
    if (!d) return;
    editor.id = d.id;
    editor.cor = d.cor || CORES[0];
    $("#editar-nome").value = d.nome || "";
    $("#editar-curso").value = d.curso || "";
    $("#editar-codigo").value = d.codigo || "";
    $("#editar-sala").value = d.sala || d.local || "";
    $("#editar-horario").value = d.horario || "";
    $("#editar-aplicar").checked = false;
    $("#editar-quantas").textContent = aulasDe(d.id).length;
    desenharCores("#cores-editar", editor.cor, "data-cor-editar");
    $("#capa-editar").hidden = false;
    document.body.style.overflow = "hidden";
    setTimeout(() => $("#editar-nome").focus(), 30);
  }

  function fecharEditor() {
    $("#capa-editar").hidden = true;
    document.body.style.overflow = "";
    editor.id = null;
  }

  async function salvarEdicao() {
    const d = porId(estado.disciplinas, editor.id);
    if (!d) { fecharEditor(); return; }

    const nome = $("#editar-nome").value.trim();
    if (!nome) { avisar("A disciplina precisa de um nome."); $("#editar-nome").focus(); return; }

    const horario = $("#editar-horario").value.trim();
    const aplicar = $("#editar-aplicar").checked;
    const faixa = aplicar && horario ? lerHorario(horario) : null;
    if (aplicar && horario && !faixa) { avisar("Não entendi esse horário. Use algo como 19:00–20:40."); $("#editar-horario").focus(); return; }

    await salvarDisciplina(Object.assign({}, d, {
      nome: nome,
      curso: $("#editar-curso").value.trim(),
      codigo: $("#editar-codigo").value.trim(),
      sala: $("#editar-sala").value.trim(),
      horario: horario,
      cor: editor.cor
    }));

    let alteradas = 0;
    if (faixa) {
      const lista = aulasDe(d.id);
      for (const a of lista) {
        if (a.inicio === faixa.inicio && a.fim === faixa.fim) continue;
        await salvarAula(Object.assign({}, a, { inicio: faixa.inicio, fim: faixa.fim }));
        alteradas++;
      }
    }

    fecharEditor();
    agendarDesenho();
    avisar("Disciplina atualizada." + (alteradas ? " Horário aplicado a " + alteradas + (alteradas > 1 ? " aulas." : " aula.") : ""));
  }

  let responderConfirmacao = null;

  function perguntar(titulo, texto, rotulo, perigo) {
    return new Promise((resolve) => {
      $("#confirmar-titulo").textContent = titulo;
      $("#confirmar-texto").textContent = texto;
      $("#btn-sim").textContent = rotulo;
      $("#btn-sim").classList.toggle("btn-perigo", !!perigo);
      $("#capa-confirmar").hidden = false;
      document.body.style.overflow = "hidden";
      responderConfirmacao = resolve;
      setTimeout(() => $("#btn-nao").focus(), 30);
    });
  }

  function responder(valor) {
    if (!responderConfirmacao) return;
    const resolve = responderConfirmacao;
    responderConfirmacao = null;
    $("#capa-confirmar").hidden = true;
    document.body.style.overflow = "";
    resolve(valor);
  }

  function abrirNota(aulaId) {
    estado.abertos.add(aulaId);
    agendarDesenho();
    setTimeout(() => {
      const campo = document.querySelector('[data-campo-nota="' + aulaId + '"]');
      if (campo) { campo.focus(); campo.setSelectionRange(campo.value.length, campo.value.length); }
    }, 20);
  }

  async function salvarNota(aulaId) {
    const texto = String(estado.rascunhos[aulaId] || "").trim();
    if (!texto) { avisar("Escreva algo antes de salvar."); return; }
    const aula = porId(estado.aulas, aulaId);
    if (!aula) return;
    const atualizada = Object.assign({}, aula, { notas: (aula.notas || []).concat([{ id: id(), texto: texto, em: Date.now() }]) });
    delete estado.rascunhos[aulaId];
    estado.abertos.delete(aulaId);
    await salvarAula(atualizada);
    agendarDesenho();
    avisar("Anotação salva.");
  }

  async function apagarNota(aulaId, notaId) {
    const aula = porId(estado.aulas, aulaId);
    if (!aula) return;
    const atualizada = Object.assign({}, aula, { notas: (aula.notas || []).filter((n) => n.id !== notaId) });
    await salvarAula(atualizada);
    agendarDesenho();
  }

  document.addEventListener("click", (ev) => {
    if (!$("#capa-editar").hidden) {
      const corEditar = ev.target.closest("[data-cor-editar]");
      if (corEditar) { editor.cor = corEditar.dataset.corEditar; desenharCores("#cores-editar", editor.cor, "data-cor-editar"); return; }
      if (ev.target.closest("#btn-editar-salvar")) { salvarEdicao(); return; }
      if (ev.target.closest("#fechar-editar") || ev.target.closest("#btn-editar-cancelar") || ev.target === $("#capa-editar")) fecharEditor();
      return;
    }

    if (!$("#capa-confirmar").hidden) {
      if (ev.target.closest("#btn-sim")) responder(true);
      else if (ev.target.closest("#btn-nao") || ev.target === $("#capa-confirmar")) responder(false);
      return;
    }

    const aba = ev.target.closest("[data-aba]");
    if (aba) { estado.aba = aba.dataset.aba; estado.todasAsAulas = false; agendarDesenho(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }

    if (ev.target.closest("#aba-nova") || ev.target.closest("#btn-importar")) { abrirImportador(null); return; }
    if (ev.target.closest("#btn-exportar")) {
      if (!estado.disciplinas.length) { avisar("Importe um plano de ensino antes de exportar."); return; }
      exportar(estado.aba === "painel" ? null : estado.aba);
      return;
    }
    if (ev.target.closest("#fechar-importador") || ev.target.closest("#btn-cancelar")) { fecharImportador(); return; }
    if (ev.target.closest("#btn-confirmar")) { confirmarImportacao(); return; }
    if (ev.target.closest("#btn-exemplo")) { $("#entrada").value = exemplo(); $("#campo-nome").value = ""; $("#campo-horario").value = ""; atualizarPrevia(); return; }
    if (ev.target === $("#capa-importador")) { fecharImportador(); return; }

    const cor = ev.target.closest("[data-cor]");
    if (cor) { imp.cor = cor.dataset.cor; desenharCores("#cores", imp.cor, "data-cor"); return; }

    const alvo = ev.target.closest("[data-acao]");
    if (!alvo) return;
    const acao = alvo.dataset.acao;

    if (acao === "importar") abrirImportador(null);
    else if (acao === "editar-disc") abrirEditor(alvo.dataset.disc);
    else if (acao === "reimportar") abrirImportador(alvo.dataset.disc);
    else if (acao === "abrir") { estado.aba = alvo.dataset.disc; estado.todasAsAulas = false; agendarDesenho(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (acao === "abrir-nota") abrirNota(alvo.dataset.aula);
    else if (acao === "cancelar-nota") { estado.abertos.delete(alvo.dataset.aula); delete estado.rascunhos[alvo.dataset.aula]; agendarDesenho(); }
    else if (acao === "salvar-nota") salvarNota(alvo.dataset.aula);
    else if (acao === "apagar-nota") apagarNota(alvo.dataset.aula, alvo.dataset.nota);
    else if (acao === "alternar-incompleta") alternarIncompleta(alvo.dataset.aula);
    else if (acao === "abrir-etiqueta") abrirEtiqueta(alvo.dataset.aula);
    else if (acao === "cancelar-etiqueta") fecharEtiqueta(alvo.dataset.aula);
    else if (acao === "sugestao-etiqueta") adicionarEtiqueta(alvo.dataset.aula, alvo.dataset.valor);
    else if (acao === "confirmar-etiqueta") {
      const campo = document.querySelector('[data-campo-etiqueta="' + alvo.dataset.aula + '"]');
      adicionarEtiqueta(alvo.dataset.aula, campo ? campo.value : "");
    }
    else if (acao === "remover-etiqueta") removerEtiqueta(alvo.dataset.aula, alvo.dataset.etiqueta);
    else if (acao === "exportar-disc") exportar(alvo.dataset.disc);
    else if (acao === "alternar-crono") { estado.todasAsAulas = !estado.todasAsAulas; }
    else if (acao === "editar-celula") abrirEdicaoCelula(alvo.dataset.aula, alvo.dataset.campo);
    else if (acao === "cancelar-celula") fecharEdicaoCelula();
    else if (acao === "salvar-celula") {
      const entrada = document.querySelector('[data-foco="cel-' + alvo.dataset.aula + '-' + alvo.dataset.campo + '"]');
      if (entrada) salvarCampoCronograma(alvo.dataset.aula, alvo.dataset.campo, entrada.value);
    }
    else if (acao === "verificar-duplicatas") {
      removerDuplicadas(alvo.dataset.disc).then((n) => {
        agendarDesenho();
        avisar(n ? n + (n > 1 ? " aulas duplicadas foram removidas." : " aula duplicada foi removida.") : "Nenhuma duplicata encontrada.");
      });
    }
    else if (acao === "abrir-arquivadas") { estado.aba = "arquivadas"; agendarDesenho(); window.scrollTo({ top: 0, behavior: "smooth" }); }
    else if (acao === "copiar-resumo-prova") {
      const d = porId(estado.disciplinas, alvo.dataset.disc);
      const aula = porId(estado.aulas, alvo.dataset.aula);
      if (!d || !aula) return;
      navigator.clipboard.writeText(resumoProva(d, aula)).then(
        () => avisar("Resumo copiado — cole numa conversa com o Claude junto do banco de questões."),
        () => avisar("Não consegui copiar agora. Tente novamente.")
      );
    }
    else if (acao === "arquivar-disc" || acao === "reativar-disc") {
      const d = porId(estado.disciplinas, alvo.dataset.disc);
      if (!d) return;
      const arquivar = acao === "arquivar-disc";
      salvarDisciplina(Object.assign({}, d, { arquivada: arquivar })).then(() => {
        agendarDesenho();
        avisar("“" + d.nome + "” foi " + (arquivar ? "arquivada." : "reativada."));
      });
    }
    else if (acao === "remover-disc") {
      const d = porId(estado.disciplinas, alvo.dataset.disc);
      if (!d) return;
      const quantas = aulasDe(d.id).length;
      const comNota = aulasDe(d.id).filter(temNota).length;
      perguntar(
        "Remover " + d.nome + "?",
        "As " + quantas + " aulas do cronograma" + (comNota ? " e as anotações de " + comNota + (comNota > 1 ? " delas" : " delas") : "") +
          " serão apagadas. Não dá para desfazer.",
        "Remover disciplina",
        true
      ).then((ok) => {
        if (!ok) return;
        apagarDisciplina(d);
        avisar("“" + d.nome + "” foi removida.");
      });
    }
  });

  document.addEventListener("input", (ev) => {
    const campo = ev.target;
    if (campo.dataset && campo.dataset.campoNota) {
      estado.rascunhos[campo.dataset.campoNota] = campo.value;
      ajustarAltura(campo);
      return;
    }
    if (campo.id === "entrada" || campo.id === "campo-ano") atualizarPrevia();
  });

  document.addEventListener("keydown", (ev) => {
    if (ev.target.classList && ev.target.classList.contains("celula-input")) {
      if (ev.key === "Enter") { ev.preventDefault(); salvarCampoCronograma(ev.target.dataset.aula, ev.target.dataset.campo, ev.target.value); }
      else if (ev.key === "Escape") { ev.preventDefault(); fecharEdicaoCelula(); }
      return;
    }
    if (ev.target.classList && ev.target.classList.contains("etiqueta-input")) {
      if (ev.key === "Enter") { ev.preventDefault(); adicionarEtiqueta(ev.target.dataset.campoEtiqueta, ev.target.value); }
      else if (ev.key === "Escape") { ev.preventDefault(); fecharEtiqueta(ev.target.dataset.campoEtiqueta); }
      return;
    }
    if (ev.key === "Enter" && !$("#capa-editar").hidden && ev.target.tagName === "INPUT" && ev.target.type === "text") {
      ev.preventDefault();
      salvarEdicao();
      return;
    }
    if (ev.key === "Escape" && !$("#capa-editar").hidden) { fecharEditor(); return; }
    if (ev.key === "Escape" && !$("#capa-confirmar").hidden) { responder(false); return; }
    if (ev.key === "Escape" && !$("#capa-importador").hidden) { fecharImportador(); return; }
    if ((ev.metaKey || ev.ctrlKey) && ev.key === "Enter") {
      const campo = ev.target;
      if (campo.dataset && campo.dataset.campoNota) { ev.preventDefault(); salvarNota(campo.dataset.campoNota); }
      else if (!$("#capa-editar").hidden) { ev.preventDefault(); salvarEdicao(); }
      else if (!$("#capa-importador").hidden && !$("#btn-confirmar").disabled) { ev.preventDefault(); confirmarImportacao(); }
    }
  });

  /* ============================================================
     início
     ============================================================ */

  lerLocal();
  if (estado.disciplinas.length) estado.pronto = true;
  desenhar();
  setTimeout(() => { if (!estado.pronto) { estado.pronto = true; agendarDesenho(); } }, 1500);
  ligarNuvem();
})();
</script>
